asyncapi: 2.6.0
info:
  title: ОКТУС — события задач и вложений
  version: 1.2.0
  description: |
    Конверт и топики — **как на ИФТ** (логи 2026-09-07 / 2026-09-08).
    Новые имена событий и отдельные топики под файлы не вводим:
    сопровождение уже читает `header` + `body` и `evtType`.

    Расширение 1.2: в `body` добавляется необязательный массив `attachments`.
    Бинарник в Kafka не едет — только ссылка на объект ФИР (claim-check).

    К АС ВСК события не публикуем. Внешний канал — синхронный poll.

    Идемпотентность: ключ Kafka = `header.evtId`. Повтор того же `evtId`
    не создаёт второй файл и не двигает версию задачи повторно.

    Версия задачи: входящее `body.lastUpdateTime`, исходящее
    `body.lastModifTimestamp`. Событие старше сохранённой версии отбрасываем.

    Гарантия at-least-once: ack после записи состояния; карантин
    `oktus_integr`; сверка пропусков.

    Топики:
    - ПАРУС → ОКТУС: `PARUS-CI00448138.COMMONTASKCHANGEDUPDATE`
      (имя из архитектуры; в логе ИФТ топик не напечатан, тело — с ИФТ)
    - ОКТУС → ПАРУС: `OKTUS-CI06621477.COMMONTASKCHANGEDUPDATE`
      (имя топика без суффикса .V1; .V1 в логе — версия схемы)
    - `PARUS.IN.EXTERNALIMPLEMENTATIONTASK` — другой контур, не канал вложений

    Обработчики: integr-task-002 inbound, integr-task-003 outbound.

  contact:
    name: Климова Олеся
    email: Klimova.O.Yury@sberbank.ru

defaultContentType: application/json

channels:
  PARUS-CI00448138.COMMONTASKCHANGEDUPDATE:
    description: |
      ПАРУС публикует факт по заявке. На ИФТ — `evtType=TaskCreate`.
      Потребитель логирует `event=[{header, body}]`; в топике одно событие.
    subscribe:
      operationId: consumeParusTaskEvent
      summary: ОКТУС читает факт и при attachments[].action=ADDED забирает файл GET по ссылке ФИР ПАРУС
      message:
        $ref: '#/components/messages/ParusToOktusEvent'

  OKTUS-CI06621477.COMMONTASKCHANGEDUPDATE:
    description: |
      ОКТУС публикует факт по заявке. На ИФТ — `evtType=NotifySuccess`,
      ключ сообщения = `header.evtId`.
    publish:
      operationId: publishOktusTaskEvent
      summary: ПАРУС читает факт; если в body есть attachments — забирает файл GET по ссылке ФИР ОКТУС
      message:
        $ref: '#/components/messages/OktusToParusEvent'

components:
  messages:
    ParusToOktusEvent:
      name: ParusServiceTaskEvent
      title: Событие ПАРУС → ОКТУС
      description: |
        Конверт ИФТ: `header` + `body`.
        `srcModule=PARUS.PTM`. На ИФТ зафиксирован `evtType=TaskCreate`.
        Обновление заявки и файлов — тот же конверт, другой `evtType`
        (не отдельное имя TaskChangedEvent).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ParusInboundEnvelope'
      examples:
        - name: taskCreateIft
          summary: ИФТ, TaskCreate, без вложений
          payload:
            header:
              evtId: b3f127eb-f776-4ea5-8062-38e9505c63f2
              evtType: TaskCreate
              evtVersion: 1
              srcModule: PARUS.PTM
              evtDate: 1788816657
              sndDate: 1788816664
            body:
              taskUid: TSK000659771
              title: Проведение профилактических работ
              assignmentGroup: Sberbank of Russia
              assignee: null
              substatus: CREATED
              resolutionCode: null
              initiator: test_ift_16 test_ift_16 test_ift_16
              nextBreach: "2026-09-08T12:11:00Z"
              workTypeName: Проведение профилактических работ
              lastUpdateTime: "2026-09-07T21:30:57.023852Z"
              tb: "018"
              description: Тестовая задача
              preferableArrivalTime: "2026-09-11T07:26:44.359Z"
              deviceType: Банкомат
              address: "186792, Республика Карелия, Респ Карелия, г Сортавала, п Кирьявалахти, ул Гранитная, к.1кв. 769"
              latitude: "20.701068"
              longitude: "91.866217"
              placeTimeOffset: "3"
              gosb: "8603"
              deviceModel: "8888"
              placeName: OOO "DEZ LEVOBEREZHNYY"
              deviceSerialNumber: Y755000063
              deviceUid: "010837"
        - name: taskCreateWithAttachment
          summary: To-be 1.2 — тот же конверт, в body добавлен attachments
          payload:
            header:
              evtId: 7a0e1c2d-3b4a-4c5e-9d10-112233445566
              evtType: TaskCreate
              evtVersion: 1
              srcModule: PARUS.PTM
              evtDate: 1788816657
              sndDate: 1788816664
            body:
              taskUid: TSK000659771
              substatus: CREATED
              lastUpdateTime: "2026-09-07T21:30:57.023852Z"
              title: Проведение профилактических работ
              attachments:
                - attachmentId: att-parus-001
                  fileName: plan-floor-3.pdf
                  contentType: application/pdf
                  sizeBytes: 2457600
                  source: PARUS
                  action: ADDED
                  downloadUrl: https://parus-s3.internal/objects/plan-floor-3.pdf

    OktusToParusEvent:
      name: ParusServiceTaskEvent
      title: Событие ОКТУС → ПАРУС
      description: |
        Конверт ИФТ: `header` + `body` (класс ParusServiceTaskEvent).
        `srcModule=OKTUS`, на ИФТ `evtType=NotifySuccess`.
        Файл ВСК после СПАП CLEAN уходит тем же событием:
        в `body.attachments` ссылка на ФИР ОКТУС. Отдельный AttachmentReadyEvent
        не вводим.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OktusOutboundEnvelope'
      examples:
        - name: notifySuccessIft
          summary: ИФТ, NotifySuccess, без вложений
          payload:
            header:
              evtId: 2168ed8b-de6d-4306-91cd-7825bd2f68f9
              evtType: NotifySuccess
              srcModule: OKTUS
              evtDate: 1788816665238897000
              sndDate: 1788816673422332857
            body:
              taskUid: TSK000659771
              substatusCode: ASSIGNED
              substatusName: Назначено
              sourceSystem: PARUS.PTM
              externalUid: TSK000000000000000000000000001054334
              title: Проведение профилактических работ
              workTypeName: Проведение профилактических работ
              assignmentGroup: Sberbank of Russia
              address: "186792, Республика Карелия, Респ Карелия, г Сортавала, п Кирьявалахти, ул Гранитная, к.1кв. 769"
              placeName: OOO "DEZ LEVOBEREZHNYY"
              latitude: 20.701068
              longitude: 91.866217
              tbName: "018"
              gosbName: "8603"
              deviceUid: "010837"
              deviceType: Банкомат
              deviceModel: "8888"
              deviceSerialNumber: Y755000063
              timezoneOffset: 3
              breachTime: "2026-09-08T12:11Z"
              planFinishDate: "2026-09-11T07:26:44.359Z"
              lastModifTimestamp: "2026-09-07T21:31:05.238897Z"
        - name: notifySuccessWithAttachment
          summary: To-be 1.2 — тот же NotifySuccess, в body добавлен attachments
          payload:
            header:
              evtId: 9f8e7d6c-5b4a-4321-8901-223344556677
              evtType: NotifySuccess
              srcModule: OKTUS
              evtDate: 1788816665238897000
              sndDate: 1788816673422332857
            body:
              taskUid: TSK000659771
              substatusCode: ASSIGNED
              lastModifTimestamp: "2026-09-07T21:31:05.238897Z"
              attachments:
                - attachmentId: att-vsk-014
                  fileName: photo-atm-installed.jpg
                  contentType: image/jpeg
                  sizeBytes: 1843200
                  source: VSK
                  action: ADDED
                  scanStatus: CLEAN
                  downloadUrl: https://oktus-s3.internal/objects/att-vsk-014

  schemas:
    EventHeader:
      type: object
      required: [evtId, evtType, srcModule, evtDate, sndDate]
      properties:
        evtId:
          type: string
          format: uuid
          description: Идемпотентный ключ. На ИФТ совпадает с key сообщения Kafka.
        evtType:
          type: string
          description: |
            Тип факта. На ИФТ входящее — TaskCreate, исходящее — NotifySuccess.
            Новый тип под файлы не заводим.
        evtVersion:
          type: integer
          description: Есть на входящем ИФТ (=1). На исходящем toString не печатает.
        srcModule:
          type: string
          description: PARUS.PTM на входе, OKTUS на выходе
        evtDate:
          type: integer
          description: |
            Время события. На входящем ИФТ — секунды (1788816657),
            на исходящем — наносекунды (1788816665238897000).
        sndDate:
          type: integer
          description: Время отправки. Та же разница единиц, что у evtDate.

    AttachmentRef:
      type: object
      required: [fileName, source, action, downloadUrl]
      properties:
        attachmentId:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        source:
          type: string
          enum: [PARUS, VSK]
        action:
          type: string
          enum: [ADDED, REMOVED, REPLACED]
        scanStatus:
          type: string
          enum: [CLEAN]
          description: Только на исходящем после СПАП CLEAN
        downloadUrl:
          type: string
          format: uri
          description: Ссылка GET объекта ФИР. Не содержимое файла.
        checksumSha256:
          type: string

    ParusInboundEnvelope:
      type: object
      required: [header, body]
      properties:
        header:
          allOf:
            - $ref: '#/components/schemas/EventHeader'
            - type: object
              properties:
                evtType:
                  example: TaskCreate
                srcModule:
                  const: PARUS.PTM
        body:
          $ref: '#/components/schemas/ParusInboundBody'

    ParusInboundBody:
      type: object
      required: [taskUid]
      properties:
        taskUid:
          type: string
          example: TSK000659771
        title:
          type: string
        assignmentGroup:
          type: string
        assignee:
          type: string
          nullable: true
        substatus:
          type: string
          description: На ИФТ — CREATED. Не путать с исходящим substatusCode.
        resolutionCode:
          type: string
          nullable: true
        initiator:
          type: string
        nextBreach:
          type: string
          format: date-time
        workTypeName:
          type: string
        lastUpdateTime:
          type: string
          format: date-time
          description: Версия задачи на входе. Событие старше сохранённой версии отбрасываем.
        tb:
          type: string
        description:
          type: string
        serviceTimeFLM:
          type: string
          description: На ИФТ — JSON-строка графика, не массив
        serviceTime:
          type: string
        serviceTimeSLM:
          type: string
        preferableArrivalTime:
          type: string
          format: date-time
        deviceType:
          type: string
        address:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        placeTimeOffset:
          type: string
        gosb:
          type: string
        deviceModel:
          type: string
        placeName:
          type: string
        deviceSerialNumber:
          type: string
        deviceUid:
          type: string
        attachments:
          type: array
          description: Расширение 1.2. На текущем ИФТ поля нет.
          items:
            $ref: '#/components/schemas/AttachmentRef'

    OktusOutboundEnvelope:
      type: object
      required: [header, body]
      properties:
        header:
          allOf:
            - $ref: '#/components/schemas/EventHeader'
            - type: object
              properties:
                evtType:
                  example: NotifySuccess
                srcModule:
                  const: OKTUS
        body:
          $ref: '#/components/schemas/OktusOutboundBody'

    OktusOutboundBody:
      type: object
      required: [taskUid]
      properties:
        taskUid:
          type: string
        substatusCode:
          type: string
          description: На ИФТ — ASSIGNED. Не путать с входящим substatus.
        substatusName:
          type: string
        assigneeName:
          type: string
          nullable: true
        sourceSystem:
          type: string
          example: PARUS.PTM
        counterpartTaskUid:
          type: string
          nullable: true
        actualStartTime:
          type: string
          nullable: true
        actualFinishTime:
          type: string
          nullable: true
        resolutionCode:
          type: string
          nullable: true
        resolution:
          type: string
          nullable: true
        errorData:
          type: string
          nullable: true
        externalUid:
          type: string
        title:
          type: string
        workTypeName:
          type: string
        description:
          type: string
        assignmentGroup:
          type: string
        returnCount:
          type: integer
          nullable: true
        address:
          type: string
        placeName:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        tbName:
          type: string
        gosbName:
          type: string
        deviceUid:
          type: string
        deviceType:
          type: string
        deviceModel:
          type: string
        deviceSerialNumber:
          type: string
        timezoneOffset:
          type: integer
        graphAccessClient:
          type: array
          items:
            type: object
        graphAccessFlm:
          type: array
          items:
            type: object
        graphAccessSlm:
          type: array
          items:
            type: object
        breachTime:
          type: string
        planFinishDate:
          type: string
          format: date-time
        completeTimestamp:
          type: string
          nullable: true
        lastModifTimestamp:
          type: string
          format: date-time
          description: Версия задачи на выходе (аналог lastUpdateTime входа)
        attachments:
          type: array
          description: Расширение 1.2. На текущем ИФТ поля нет.
          items:
            $ref: '#/components/schemas/AttachmentRef'
