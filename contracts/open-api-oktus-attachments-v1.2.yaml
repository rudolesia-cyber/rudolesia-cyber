openapi: 3.0.1
info:
  title: API ФП ПАРУС.ОКТУС — вложения задач
  version: 1.2.0
  description: |
    Версия 1.2 дополняет действующий контракт задач v1.1. Существующие методы
    не меняются. В карточку задачи добавлено необязательное поле `attachments`.

    API вызывает автоматизированная система внешней сервисной компании (АС ВСК)
    по взаимному TLS-сертификату организации УЦ Банка. Организация видит и меняет
    только свои задачи. Сертификат не принят — 401. Задача или файл чужие — 403.

    Операции вложений:
    - список файлов в `GET /tasks` и `GET /tasks/{taskId}` (без содержимого);
    - `GET /tasks/{taskId}/attachments/{attachmentId}` — временная ссылка;
    - `POST /tasks/{taskId}/attachments` — загрузка файла;
    - `DELETE /tasks/{taskId}/attachments/{attachmentId}` — удаление своего файла.

    Скачивание. API возвращает ссылку на объект в файловом хранилище ОКТУС.
    Срок жизни ссылки — 15 минут. Сам файл ВСК забирает отдельным HTTP GET.

    Загрузка. Файл передаётся в JSON, поле `contentBase64`. Размер файла —
    не больше 10 МБ. Сначала запрос проверяет SOWA, затем содержимое — антивирус
    СПАП. Отказ SOWA — 403, запрос внутрь не идёт. Отказ СПАП — 422, файл
    во внутренний контур не попадает. Если сервис проверки или хранилище
    недоступны — 503, файл не принимаем.

    Форматы от Банка (`source=PARUS`): pdf, xlsx, doc, jpg, jpeg, pptx.
    Форматы от подрядчика (`source=VSK`): jpg, jpeg, xlsx, doc, pptx, drawio.

    Удалять можно только свои файлы подрядчика. Файлы Банка удалить нельзя.
    Загрузка и удаление запрещены, если задача закрыта (409). Закрыть задачу
    без файлов можно; при необходимости ПАРУС вернёт её в работу.

    Файлы Банка с признаком конфиденциальности K-2 в список не входят
    и по ссылке не выдаются (404).

    Повтор загрузки. Обязательный заголовок `Idempotency-Key`. Один ключ
    в рамках организации и задачи действует 24 часа. То же тело — тот же
    ответ 201. Другое тело — 409.

    Если ответ не получен за 30 секунд, ВСК не считает файл принятым
    и повторяет запрос с тем же ключом. Повторять можно только при 503
    и обрыве сети, не больше трёх попыток.

    Изменение состава файлов обновляет `lastUpdateTime` задачи.
    Клиент видит это при следующем опросе. Если ссылка истекла,
    ВСК запрашивает новую.

  contact:
    name: Климова Олеся
    email: Klimova.O.Yury@sberbank.ru

servers:
  - url: https://api.oktus.sber.ru:8800/oktus/api/v1
    description: Промышленный стенд
  - url: https://api-psi.oktus.sber.ru:8800/oktus/api/v1
    description: Тестовый стенд

tags:
  - name: Attachments
    description: Вложения задачи

security:
  - clientCert: []

paths:
  /tasks/{taskId}/attachments:
    post:
      operationId: uploadTaskAttachment
      tags: [Attachments]
      summary: Загрузка вложения к задаче
      description: |
        Подрядчик прикладывает файл результата работ.
        Задача должна принадлежать организации и не быть закрытой.
        Перед приёмом файл проверяет антивирус.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAttachmentRequest'
            example:
              fileName: "photo-atm-installed.jpg"
              contentType: "image/jpeg"
              contentBase64: "/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA..."
              checksumSha256: "bb12aa88c0ff0011"
      responses:
        '201':
          description: Файл принят и сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Задача CLOSED либо конфликт идемпотентности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Файл или тело запроса превысили лимит
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Антивирус отклонил файл или формат не допускается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Unavailable'

  /tasks/{taskId}/attachments/{attachmentId}:
    get:
      operationId: downloadTaskAttachment
      tags: [Attachments]
      summary: Временная ссылка на скачивание вложения
      description: |
        Возвращает сведения о файле и временную ссылку на скачивание.
        Ссылка действует 15 минут. Содержимое файла в ответе не передаётся.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: Метаданные и временная ссылка GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDownload'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Файл ещё не прошёл проверку (PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteTaskAttachment
      tags: [Attachments]
      summary: Удаление своего вложения
      description: |
        Удаляет файл, который загрузила сама организация.
        Файл Банка удалить нельзя. Для закрытой задачи — 409.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '204':
          description: Удалено
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Задача CLOSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z0-9]+[-]?[A-Z0-9]+[-]?[A-Z0-9]+$'
        maxLength: 20
        example: TSK000123456
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        example: att-vsk-014
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Ключ повторной загрузки. Действует 24 часа в рамках организации и задачи.
        То же тело — тот же ответ 201. Другое тело — 409.
      schema:
        type: string
        format: uuid

  securitySchemes:
    clientCert:
      type: apiKey
      in: header
      name: X-Client-Org
      description: |
        Взаимный TLS. Сертификат организации проверяется на входе.
        Без принятого сертификата — 401. Чужой объект — 403.

  responses:
    ValidationError:
      description: Неверные параметры
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Сертификат не принят на входе
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccessDenied:
      description: |
        Нет доступа: чужая задача или файл, запрет удалить файл Банка
        либо отказ проверки запроса на входе.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Задача или вложение не найдены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Сервис файлов, хранилище или антивирус недоступны
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AttachmentSource:
      type: string
      enum: [PARUS, VSK]
    ScanStatus:
      type: string
      enum: [PENDING, CLEAN, REJECTED]
    Attachment:
      type: object
      required: [attachmentId, fileName, source, sizeBytes, scanStatus, uploadedAt]
      properties:
        attachmentId:
          type: string
          example: att-vsk-014
        fileName:
          type: string
          maxLength: 255
          example: photo-atm-installed.jpg
        contentType:
          type: string
          example: image/jpeg
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        source:
          $ref: '#/components/schemas/AttachmentSource'
        scanStatus:
          $ref: '#/components/schemas/ScanStatus'
        checksumSha256:
          type: string
        uploadedAt:
          type: string
          format: date-time
    AttachmentDownload:
      allOf:
        - $ref: '#/components/schemas/Attachment'
        - type: object
          required: [downloadUrl, downloadUrlExpiresAt]
          properties:
            downloadUrl:
              type: string
              format: uri
              description: Временная ссылка на скачивание файла
              example: https://oktus-s3.example/objects/att-parus-003?X-Amz-Expires=900
            downloadUrlExpiresAt:
              type: string
              format: date-time
              description: Срок жизни ссылки, 15 минут от выдачи
    UploadAttachmentRequest:
      type: object
      required: [fileName, contentType, contentBase64]
      properties:
        fileName:
          type: string
          maxLength: 255
          pattern: '.+\.(jpg|jpeg|xlsx|doc|pptx|drawio)$'
        contentType:
          type: string
          enum:
            - image/jpeg
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - application/msword
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
            - application/vnd.jgraph.mxfile
            - application/xml
        contentBase64:
          type: string
          format: byte
        checksumSha256:
          type: string
          description: Контрольная сумма. Если не совпадает с файлом — 400.
    ErrorResponse:
      type: object
      required: [errorCode, message, timestamp]
      properties:
        errorCode:
          type: string
          enum:
            - VALIDATION_ERROR
            - TASK_ACCESS_DENIED
            - TASK_NOT_FOUND
            - ATTACHMENT_NOT_FOUND
            - FILE_DELETE_FORBIDDEN
            - SOWA_VALIDATION_DENIED
            - FILE_TOO_LARGE
            - FILE_TYPE_NOT_ALLOWED
            - FILE_REJECTED_BY_SCAN
            - FILE_SCAN_PENDING
            - TASK_CLOSED
            - IDEMPOTENCY_CONFLICT
            - UNAUTHORIZED
            - SERVICE_UNAVAILABLE
        message:
          type: string
          maxLength: 500
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        timestamp:
          type: string
          format: date-time

    TaskAttachmentsExtension:
      description: |
        Необязательное поле карточки задачи.
        Файлы с признаком K-2 в список не входят.
      type: object
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
