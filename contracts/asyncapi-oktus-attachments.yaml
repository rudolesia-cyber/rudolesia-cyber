asyncapi: 2.6.0
info:
  title: ОКТУС — события задач и вложений
  version: 1.2.0
  description: |
    События по заявкам между ПАРУС и ОКТУС. Подрядчику события не отправляются:
    изменения он запрашивает сам через API.

    Сообщение состоит из `header` и `body`. Ключ сообщения — `header.evtId`.
    В теле версии 1.2 может быть необязательный список `attachments`.
    В событии передаётся ссылка на файл, не сам файл.

    Типы событий:
    - ПАРУС → ОКТУС: `TaskCreate`, `TaskUpdate`
    - ОКТУС → ПАРУС: `NotifySuccess`, `NotifyError`, `Snapshot`, `TaskUpdate`

    Повтор с тем же `evtId` не создаёт второй файл и не меняет
    версию задачи повторно. Версия задачи во входящем событии —
    `lastUpdateTime`, в исходящем — `lastModifTimestamp`. Более старое
    событие не применяется.

    Топики:
    - ПАРУС → ОКТУС: `PARUS-CI00448138.COMMONTASKCHANGEDUPDATE`
    - ОКТУС → ПАРУС: `OKTUS-CI06621477.COMMONTASKCHANGEDUPDATE`

  contact:
    name: Климова Олеся
    email: Klimova.O.Yury@sberbank.ru

defaultContentType: application/json

channels:
  PARUS-CI00448138.COMMONTASKCHANGEDUPDATE:
    description: |
      ПАРУС сообщает о создании или изменении заявки.
      Типы: `TaskCreate`, `TaskUpdate`. Ключ сообщения — `header.evtId`.
    subscribe:
      operationId: consumeParusTaskEvent
      summary: ОКТУС принимает событие и при необходимости забирает файл по ссылке
      message:
        $ref: '#/components/messages/ParusToOktusEvent'

  OKTUS-CI06621477.COMMONTASKCHANGEDUPDATE:
    description: |
      ОКТУС сообщает об изменении заявки.
      Типы: `NotifySuccess`, `NotifyError`, `Snapshot`, `TaskUpdate`.
      Ключ сообщения — `header.evtId`.
    publish:
      operationId: publishOktusTaskEvent
      summary: ПАРУС принимает событие и при необходимости забирает файл по ссылке
      message:
        $ref: '#/components/messages/OktusToParusEvent'

components:
  messages:
    ParusToOktusEvent:
      name: ParusServiceTaskEvent
      title: Событие ПАРУС → ОКТУС
      description: |
        Сообщение ПАРУС. Источник — `PARUS.PTM`.
        `TaskCreate` — заявка создана. `TaskUpdate` — заявка изменена,
        в том числе состав файлов. Если в `attachments` указан новый файл,
        ОКТУС забирает его по ссылке из хранилища ПАРУС.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ParusInboundEnvelope'
      examples:
        - name: createTask
          summary: Создание задачи без вложений
          payload:
            header:
              evtId: b3f127eb-f776-4ea5-8062-38e9505c63f2
              evtType: TaskCreate
              evtVersion: 1
              srcModule: PARUS.PTM
              evtDate: 1788816657
              sndDate: 1788816664
            body:
              taskUid: TSK000659771
              title: Проведение профилактических работ
              assignmentGroup: Sberbank of Russia
              assignee: null
              substatus: CREATED
              resolutionCode: null
              initiator: test_ift_16 test_ift_16 test_ift_16
              nextBreach: "2026-09-08T12:11:00Z"
              workTypeName: Проведение профилактических работ
              lastUpdateTime: "2026-09-07T21:30:57.023852Z"
              tb: "018"
              description: Тестовая задача
              preferableArrivalTime: "2026-09-11T07:26:44.359Z"
              deviceType: Банкомат
              address: "186792, Республика Карелия, Респ Карелия, г Сортавала, п Кирьявалахти, ул Гранитная, к.1кв. 769"
              latitude: "20.701068"
              longitude: "91.866217"
              placeTimeOffset: "3"
              gosb: "8603"
              deviceModel: "8888"
              placeName: OOO "DEZ LEVOBEREZHNYY"
              deviceSerialNumber: Y755000063
              deviceUid: "010837"
        - name: updateTaskWithAttachment
          summary: Изменение задачи с вложением Банка
          payload:
            header:
              evtId: 7a0e1c2d-3b4a-4c5e-9d10-112233445566
              evtType: TaskUpdate
              evtVersion: 1
              srcModule: PARUS.PTM
              evtDate: 1788816657
              sndDate: 1788816664
            body:
              taskUid: TSK000659771
              substatus: CREATED
              lastUpdateTime: "2026-09-07T21:30:57.023852Z"
              title: Проведение профилактических работ
              attachments:
                - attachmentId: att-parus-001
                  fileName: plan-floor-3.pdf
                  contentType: application/pdf
                  sizeBytes: 2457600
                  source: PARUS
                  action: ADDED
                  downloadUrl: https://parus-s3.internal/objects/plan-floor-3.pdf

    OktusToParusEvent:
      name: ParusServiceTaskEvent
      title: Событие ОКТУС → ПАРУС
      description: |
        Сообщение ОКТУС. Источник — `OKTUS`.
        `NotifySuccess` — изменение принято. `NotifyError` — обработать
        не удалось. `Snapshot` — полный снимок заявки. `TaskUpdate` —
        заявка изменена, в том числе состав файлов.
        Если в `attachments` указан файл подрядчика, ПАРУС забирает его
        по ссылке из хранилища ОКТУС.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OktusOutboundEnvelope'
      examples:
        - name: notifySuccess
          summary: Уведомление об изменении задачи
          payload:
            header:
              evtId: 2168ed8b-de6d-4306-91cd-7825bd2f68f9
              evtType: NotifySuccess
              srcModule: OKTUS
              evtDate: 1788816665238897000
              sndDate: 1788816673422332857
            body:
              taskUid: TSK000659771
              substatusCode: ASSIGNED
              substatusName: Назначено
              sourceSystem: PARUS.PTM
              externalUid: TSK000000000000000000000000001054334
              title: Проведение профилактических работ
              workTypeName: Проведение профилактических работ
              assignmentGroup: Sberbank of Russia
              address: "186792, Республика Карелия, Респ Карелия, г Сортавала, п Кирьявалахти, ул Гранитная, к.1кв. 769"
              placeName: OOO "DEZ LEVOBEREZHNYY"
              latitude: 20.701068
              longitude: 91.866217
              tbName: "018"
              gosbName: "8603"
              deviceUid: "010837"
              deviceType: Банкомат
              deviceModel: "8888"
              deviceSerialNumber: Y755000063
              timezoneOffset: 3
              breachTime: "2026-09-08T12:11Z"
              planFinishDate: "2026-09-11T07:26:44.359Z"
              lastModifTimestamp: "2026-09-07T21:31:05.238897Z"
        - name: notifySuccessWithAttachment
          summary: Уведомление с вложением подрядчика
          payload:
            header:
              evtId: 9f8e7d6c-5b4a-4321-8901-223344556677
              evtType: NotifySuccess
              srcModule: OKTUS
              evtDate: 1788816665238897000
              sndDate: 1788816673422332857
            body:
              taskUid: TSK000659771
              substatusCode: ASSIGNED
              lastModifTimestamp: "2026-09-07T21:31:05.238897Z"
              attachments:
                - attachmentId: att-vsk-014
                  fileName: photo-atm-installed.jpg
                  contentType: image/jpeg
                  sizeBytes: 1843200
                  source: VSK
                  action: ADDED
                  scanStatus: CLEAN
                  downloadUrl: https://oktus-s3.internal/objects/att-vsk-014
        - name: notifyError
          summary: Ошибка обработки заявки
          payload:
            header:
              evtId: 0a1b2c3d-4e5f-6789-a012-3456789abcde
              evtType: NotifyError
              srcModule: OKTUS
              evtDate: 1788816665238897000
              sndDate: 1788816673422332857
            body:
              taskUid: TSK000659771
              lastModifTimestamp: "2026-09-07T21:31:05.238897Z"
              errorData: Не удалось сохранить вложение
        - name: snapshot
          summary: Снимок заявки
          payload:
            header:
              evtId: 11223344-5566-7788-99aa-bbccddeeff00
              evtType: Snapshot
              srcModule: OKTUS
              evtDate: 1788816665238897000
              sndDate: 1788816673422332857
            body:
              taskUid: TSK000659771
              substatusCode: ASSIGNED
              lastModifTimestamp: "2026-09-07T21:31:05.238897Z"
        - name: taskUpdate
          summary: Изменение задачи со стороны ОКТУС
          payload:
            header:
              evtId: aabbccdd-eeff-0011-2233-445566778899
              evtType: TaskUpdate
              srcModule: OKTUS
              evtDate: 1788816665238897000
              sndDate: 1788816673422332857
            body:
              taskUid: TSK000659771
              substatusCode: IN_WORK
              lastModifTimestamp: "2026-09-07T21:31:05.238897Z"

  schemas:
    EventHeader:
      type: object
      required: [evtId, evtType, srcModule, evtDate, sndDate]
      properties:
        evtId:
          type: string
          format: uuid
          description: Идентификатор события. По нему отбрасывается повтор.
        evtType:
          type: string
          description: |
            Тип события.
            ПАРУС → ОКТУС: TaskCreate, TaskUpdate.
            ОКТУС → ПАРУС: NotifySuccess, NotifyError, Snapshot, TaskUpdate.
        evtVersion:
          type: integer
          description: Версия заголовка.
        srcModule:
          type: string
          description: Система-источник. Входящее — PARUS.PTM, исходящее — OKTUS.
        evtDate:
          type: integer
          description: Время события.
        sndDate:
          type: integer
          description: Время отправки.

    AttachmentRef:
      type: object
      required: [fileName, source, action, downloadUrl]
      properties:
        attachmentId:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        source:
          type: string
          enum: [PARUS, VSK]
        action:
          type: string
          enum: [ADDED, REMOVED, REPLACED]
        scanStatus:
          type: string
          enum: [CLEAN]
          description: Результат проверки файла. Передаётся после успешной проверки.
        downloadUrl:
          type: string
          format: uri
          description: Ссылка на файл в хранилище. Содержимое файла в событии не передаётся.
        checksumSha256:
          type: string

    ParusInboundEnvelope:
      type: object
      required: [header, body]
      properties:
        header:
          allOf:
            - $ref: '#/components/schemas/EventHeader'
            - type: object
              properties:
                evtType:
                  type: string
                  enum: [TaskCreate, TaskUpdate]
                  example: TaskCreate
                srcModule:
                  const: PARUS.PTM
        body:
          $ref: '#/components/schemas/ParusInboundBody'

    ParusInboundBody:
      type: object
      required: [taskUid]
      properties:
        taskUid:
          type: string
          example: TSK000659771
        title:
          type: string
        assignmentGroup:
          type: string
        assignee:
          type: string
          nullable: true
        substatus:
          type: string
          description: Статус заявки во входящем событии.
        resolutionCode:
          type: string
          nullable: true
        initiator:
          type: string
        nextBreach:
          type: string
          format: date-time
        workTypeName:
          type: string
        lastUpdateTime:
          type: string
          format: date-time
          description: Версия задачи. Более старое событие не применяется.
        tb:
          type: string
        description:
          type: string
        serviceTimeFLM:
          type: string
          description: График доступности в виде строки JSON.
        serviceTime:
          type: string
        serviceTimeSLM:
          type: string
        preferableArrivalTime:
          type: string
          format: date-time
        deviceType:
          type: string
        address:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        placeTimeOffset:
          type: string
        gosb:
          type: string
        deviceModel:
          type: string
        placeName:
          type: string
        deviceSerialNumber:
          type: string
        deviceUid:
          type: string
        attachments:
          type: array
          description: Необязательный список вложений. В событии передаётся ссылка на файл.
          items:
            $ref: '#/components/schemas/AttachmentRef'

    OktusOutboundEnvelope:
      type: object
      required: [header, body]
      properties:
        header:
          allOf:
            - $ref: '#/components/schemas/EventHeader'
            - type: object
              properties:
                evtType:
                  type: string
                  enum: [NotifySuccess, NotifyError, Snapshot, TaskUpdate]
                  example: NotifySuccess
                srcModule:
                  const: OKTUS
        body:
          $ref: '#/components/schemas/OktusOutboundBody'

    OktusOutboundBody:
      type: object
      required: [taskUid]
      properties:
        taskUid:
          type: string
        substatusCode:
          type: string
          description: Код статуса заявки в исходящем событии.
        substatusName:
          type: string
        assigneeName:
          type: string
          nullable: true
        sourceSystem:
          type: string
          example: PARUS.PTM
        counterpartTaskUid:
          type: string
          nullable: true
        actualStartTime:
          type: string
          nullable: true
        actualFinishTime:
          type: string
          nullable: true
        resolutionCode:
          type: string
          nullable: true
        resolution:
          type: string
          nullable: true
        errorData:
          type: string
          nullable: true
        externalUid:
          type: string
        title:
          type: string
        workTypeName:
          type: string
        description:
          type: string
        assignmentGroup:
          type: string
        returnCount:
          type: integer
          nullable: true
        address:
          type: string
        placeName:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        tbName:
          type: string
        gosbName:
          type: string
        deviceUid:
          type: string
        deviceType:
          type: string
        deviceModel:
          type: string
        deviceSerialNumber:
          type: string
        timezoneOffset:
          type: integer
        graphAccessClient:
          type: array
          items:
            type: object
        graphAccessFlm:
          type: array
          items:
            type: object
        graphAccessSlm:
          type: array
          items:
            type: object
        breachTime:
          type: string
        planFinishDate:
          type: string
          format: date-time
        completeTimestamp:
          type: string
          nullable: true
        lastModifTimestamp:
          type: string
          format: date-time
          description: Версия задачи в исходящем событии.
        attachments:
          type: array
          description: Необязательный список вложений. В событии передаётся ссылка на файл.
          items:
            $ref: '#/components/schemas/AttachmentRef'
